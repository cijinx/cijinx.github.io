name: 部署 VitePress 静态网站到 GitHub Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    name: 构建工作
    steps:
      - name: 检查
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: 配置 Pages
        uses: actions/configure-pages@v4
      - name: 下载依赖
        run: npm ci
      - name: 构建
        run: npm run docs:build
      - name: 上传
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: 部署
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
